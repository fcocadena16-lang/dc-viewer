.actionSheetList{display:flex;flex-direction:column;gap:11px;padding:14px}.actionSheetBtn{width:100%;border:0;border-radius:19px;padding:17px;background:var(--surface2);text-align:left;font-size:19px;font-weight:820}.actionSheetBtn small{display:block;color:var(--muted);font-size:14px;line-height:1.35;margin-top:4px;font-weight:600}
.captureWizard{display:flex;flex-direction:column;gap:15px}.captureMeta,.captureStep{background:var(--surface2);border-radius:21px;padding:16px}.captureMeta .field{padding-left:0;padding-right:0}.captureStage{font-size:14px;color:var(--muted);font-weight:750;margin-bottom:6px}.captureCell{font-size:30px;font-weight:850;letter-spacing:-.7px;margin-bottom:16px}.captureField{margin-bottom:13px}.captureField label{display:block;font-size:17px;font-weight:800;margin-bottom:8px}.captureField input{width:100%;border:0;background:#343640;color:var(--text);border-radius:17px;padding:17px 15px;font-size:24px;outline:none}.captureField input:focus{box-shadow:0 0 0 1px var(--blue) inset}.capturePair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.captureActions{display:flex;gap:11px;margin-top:4px}.captureBtn{flex:1;min-height:52px;border:0;border-radius:17px;background:var(--surface3);font-size:18px;font-weight:820}.captureBtn.primary{background:var(--blue)}.captureProgress{height:5px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin:2px 0 15px}.captureProgress span{display:block;height:100%;background:var(--blue);border-radius:99px}

<body>
<div class="app">
  <div class="topbar">
    <div class="pageTitle" id="pageTitle">Subestaciones</div>
    <div class="topActions" id="topActions"></div>
  </div>

  <section id="viewSubestaciones" class="section active">
    <input id="folderPicker" type="file" accept=".csv,text/csv,text/plain" webkitdirectory directory multiple>
    <input id="singleFilePicker" type="file" accept=".csv,text/csv,text/plain">
    <div id="stationsList" class="list"></div>
  </section>

  <section id="viewAjustes" class="section">
    <div class="settingsGroup">
      <div class="settingsTitle">Aplicación</div>
      <div class="settingsCard">
        <div class="settingsRow"><div class="settingsLabel"><strong>DC Viewer</strong><small>Historial de bancos de baterías</small></div><div id="versionValue" class="settingsValue">13.0</div></div>
        <div class="settingsRow"><div class="settingsLabel"><strong>Actualización</strong><small id="updateStatus">Buscar una versión nueva</small></div><button id="btnUpdate" class="linkBtn" type="button">Comprobar</button></div>
      </div>
    </div>
    <div class="settingsGroup">
      <div class="settingsTitle">Datos</div>
      <div class="settingsCard">
        <div class="settingsRow"><div class="settingsLabel"><strong>Subestaciones</strong></div><div id="countStations" class="settingsValue">0</div></div>
        <div class="settingsRow"><div class="settingsLabel"><strong>Descargas</strong></div><div id="countTests" class="settingsValue">0</div></div>
        <div class="settingsRow"><div class="settingsLabel"><strong>Registros</strong></div><div id="countRecords" class="settingsValue">0</div></div>
      </div>
    </div>
  </section>
</div>

<nav class="navbar" aria-label="Navegación principal">
  <button class="navBtn active" data-tab="subestaciones" type="button"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M11 2h2l1 4h3l-3 4 2 2h2v2h-3l1 8h-2l-1-8h-2l-1 8H8l1-8H6v-2h2l2-2-3-4h3l1-4Zm1 4-.4 1.5h.8L12 6Zm-1.5 4L9 12h6l-1.5-2h-3Z"/></svg><span>Subestaciones</span></button>
  <button class="navBtn" data-tab="ajustes" type="button"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.43 12.98c.04-.32.07-.65.07-.98s-.03-.66-.08-.98l2.11-1.65-2-3.46-2.49 1a7.5 7.5 0 0 0-1.7-.98L15 3.27h-4l-.35 2.66c-.61.25-1.18.58-1.7.98l-2.49-1-2 3.46 2.11 1.65c-.05.32-.08.66-.08.98s.03.66.08.98l-2.11 1.65 2 3.46 2.49-1c.52.4 1.09.73 1.7.98L11 20.73h4l.35-2.66c.61-.25 1.18-.58 1.7-.98l2.49 1 2-3.46-2.11-1.65ZM13 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-3a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></svg><span>Ajustes</span></button>
</nav>

<section id="stationOverlay" class="overlay" aria-hidden="true">
  <div class="overlayHeader">
    <button class="backBtn" data-close="stationOverlay" type="button">‹</button>
    <div id="stationOverlayTitle" class="headerTitle">Subestación</div>
    <button id="editStationBtn" class="headerBtn iconOnly" type="button" aria-label="Editar subestación"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25Zm14.71-9.04a1 1 0 0 0 0-1.42l-2.5-2.5a1 1 0 0 0-1.42 0L11.7 6.38l3.75 3.75 2.26-1.92Z"/></svg></button>

  </div>

<script>
"use strict";
const APP_VERSION="13.1";
const DB_NAME="Visor130VDB", DB_VERSION=2;
const STORE_TESTS="pruebas", STORE_STATIONS="subestaciones", STORE_RECORDS="registros";
let db=null,currentTab="subestaciones",currentStationKey=null,currentRecordDate=null,currentRecordTestId=null;
let editingStationKey=null,editingNewStation=false,pendingImportStationKey=null,captureState=null;
let swRegistration=null,swUpdateReady=false;

const VALID_STATIONS={
  HLU:"HERMOSILLO UNO",HLD:"HERMOSILLO DOS",HLS:"HERMOSILLO SEIS",HLE:"HERMOSILLO SIETE",HLO:"HERMOSILLO OCHO",HLN:"HERMOSILLO NUEVE",HCE:"HERMOSILLO CERESO",HMI:"HERMOSILLO MISION",HMA:"HERMOSILLO MANGA",URE:"URES",OAS:"OASIS",RGU:"ROLANDO GARCIA URREA",BGT:"BAGOTES",DYN:"DYNATECH",RIS:"RIO SONORA",LAD:"LADRILLERAS",SCL:"COLINAS",DER:"DERIVACION",ETO:"ESTACION TORRES",VNO:"VIÑEDOS",RAY:"RAYON",VPI:"VILLAS DEL PITIC",MAP:"MANIOBRAS APASCO",PUE:"PUEBLITOS",PIH:"PARQUE INDUSTRIAL HERMOSILLO",TCG:"TECNOLOGICO",MMU:"MUNISOL",QRG:"QUIROGA",ALZ:"ALTOZANO",TRM:"TERRAMARA",FUTURA:"VILLA MERCED",HLT:"HERMOSILLO TRES",HLC:"HERMOSILLO CUATRO",PTS:"PORTALES",
  SBU:"SUBESTACION UNO",SBT:"SUBESTACION TRES",SBI:"SUBESTACION CINCO",SBE:"SUBESTACION SIETE",SBN:"SUBESTACION NUEVE",STI:"SUBESTACION SANTA INES",SPP:"SUBESTACION PUNTO P",SEL:"SUBESTACION SELECTA",CRD:"SUBESTACION CARDONAL",SBD:"SUBESTACION DOS",SBC:"SUBESTACION CUATRO",SBS:"SUBESTACION SEIS",SBO:"SUBESTACION OCHO",SBZ:"SUBESTACION DIEZ",SBK:"SUBESTACION KINO",ACU:"SUBESTACION ACUICOLAS",TST:"SUBESTACION TASTIOTA",SNC:"SUBESTACION SAN NICOLAS"
};
const VALID_CODES=Object.keys(VALID_STATIONS);

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").trim().toLowerCase();
function toast(t,ms=2200){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove("show"),ms)}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fechaBonita(f){if(!f)return"Sin fecha";const p=f.split("-");if(p.length!==3)return f;return new Intl.DateTimeFormat("es-MX",{day:"2-digit",month:"short",year:"numeric"}).format(new Date(Number(p[0]),Number(p[1])-1,Number(p[2]))).replace(".","")}
function validCode(code){return !!VALID_STATIONS[String(code||"").toUpperCase()]}
function fullStationName(code){return VALID_STATIONS[String(code||"").toUpperCase()]||""}
function extractStationCode(filename){const base=String(filename||"").toUpperCase().replace(/\.CSV$/i,"");const tokens=base.replace(/[^A-Z0-9]+/g," ").trim().split(/\s+/).filter(Boolean);return tokens.find(t=>VALID_STATIONS[t])||""}
function extractDate(filename){const m=String(filename||"").match(/(20\d{2}-\d{2}-\d{2})/);return m?m[1]:""}
function csvPuntos(texto){const r=[];for(const raw of String(texto||"").replace(/^\uFEFF/,"").split(/\r?\n/)){const l=raw.trim();if(!l)continue;const p=l.split(",");if(p.length<2)continue;const t=parseFloat(p[0]),v=parseFloat(p[1]);if(Number.isFinite(t)&&Number.isFinite(v))r.push([t,v])}return r}
async function hash(texto){const b=new TextEncoder().encode(texto),d=await crypto.subtle.digest("SHA-256",b);return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("")}

function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE_TESTS)){const s=d.createObjectStore(STORE_TESTS,{keyPath:"id",autoIncrement:true});s.createIndex("nombre","nombre",{unique:false});s.createIndex("importado","importado",{unique:false})}if(!d.objectStoreNames.contains(STORE_STATIONS))d.createObjectStore(STORE_STATIONS,{keyPath:"clave"});if(!d.objectStoreNames.contains(STORE_RECORDS))d.createObjectStore(STORE_RECORDS,{keyPath:"id"})};r.onsuccess=()=>{db=r.result;resolve(db)};r.onerror=()=>reject(r.error)})}
function store(name,mode="readonly"){return db.transaction(name,mode).objectStore(name)}
function getAll(name){return new Promise((ok,no)=>{const r=store(name).getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>no(r.error)})}
function getOne(name,key){return new Promise((ok,no)=>{const r=store(name).get(key);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error)})}
function putOne(name,obj){return new Promise((ok,no)=>{const r=store(name,"readwrite").put(obj);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function addOne(name,obj){return new Promise((ok,no)=>{const r=store(name,"readwrite").add(obj);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function delOne(name,key){return new Promise((ok,no)=>{const r=store(name,"readwrite").delete(key);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}

function defaultStation(code){code=String(code||"").toUpperCase().trim();return{clave:norm(code),nombre:code,nombreCompleto:fullStationName(code),banco:{marca:"",tipo:"",capacidad:"",anio:"",numCeldas:60,sellada:false},cargador:{marca:"",modelo:"",capacidad:"",serie:""},creado:Date.now(),actualizado:Date.now()}}
async function ensureStation(code){code=String(code||"").toUpperCase().trim();if(!validCode(code))return null;const clave=norm(code);let s=await getOne(STORE_STATIONS,clave);if(!s){s=defaultStation(code);await putOne(STORE_STATIONS,s)}else if(!s.nombreCompleto){s.nombreCompleto=fullStationName(code);await putOne(STORE_STATIONS,s)}return s}
function recordId(clave,fecha){return clave+"|"+fecha}
function testStationCode(t){const stored=String(t?.subestacion||"").toUpperCase().trim();return validCode(stored)?stored:extractStationCode(t?.nombre||"")}
async function migrateLegacy(){const tests=await getAll(STORE_TESTS);for(const t of tests){const code=testStationCode(t);if(!code)continue;if(t.subestacion!==code){t.subestacion=code;if(!t.fecha)t.fecha=extractDate(t.nombre);await putOne(STORE_TESTS,t)}await ensureStation(code)}const stations=await getAll(STORE_STATIONS);for(const s of stations){const code=String(s.nombre||s.clave||"").toUpperCase();if(validCode(code)&&(!s.nombreCompleto||s.nombre!==code)){s.nombre=code;s.nombreCompleto=fullStationName(code);await putOne(STORE_STATIONS,s)}}}

function iconSvg(name){const m={
  plus:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7V4Z"/></svg>',
  folder:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v1H3V6Zm0 5h18l-2 8a2 2 0 0 1-2 1H5a2 2 0 0 1-2-2v-7Z"/></svg>',
  pencil:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25Zm14.71-9.04a1 1 0 0 0 0-1.42l-2.5-2.5a1 1 0 0 0-1.42 0L11.7 6.38l3.75 3.75 2.26-1.92Z"/></svg>',
  substation:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M11 2h2l1 4h3l-3 4 2 2h2v2h-3l1 8h-2l-1-8h-2l-1 8H8l1-8H6v-2h2l2-2-3-4h3l1-4Zm1 4-.4 1.5h.8L12 6Zm-1.5 4L9 12h6l-1.5-2h-3Z"/></svg>'
};return m[name]||""}

function setTab(tab){if(!["subestaciones","ajustes"].includes(tab))return;currentTab=tab;$$('.section').forEach(e=>e.classList.remove('active'));$("#view"+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add('active');$$('.navBtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$("#pageTitle").textContent=tab==='subestaciones'?'Subestaciones':'Ajustes';renderTopActions();if(tab==='subestaciones')renderStations();else renderSettings()}
function renderTopActions(){const a=$("#topActions");a.innerHTML="";if(currentTab==='subestaciones'){const folder=document.createElement('button');folder.className='iconBtn';folder.innerHTML=iconSvg('folder');folder.title='Cargar carpeta';folder.onclick=()=>$("#folderPicker").click();const add=document.createElement('button');add.className='iconBtn primary';add.innerHTML=iconSvg('plus');add.title='Nueva subestación';add.onclick=()=>openStationEditor(null,true);a.append(folder,add)}}

async function renderStations(){const cont=$("#stationsList");let stations=await getAll(STORE_STATIONS);stations=stations.filter(s=>validCode(String(s.nombre||s.clave||"").toUpperCase()));stations.sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||"",'es'));if(!stations.length){cont.innerHTML='<div class="empty">No hay subestaciones todavía.<br><br>Usa <b>+</b> para crear una válida o el icono de carpeta para importar tus CSV.</div>';return}cont.innerHTML="";for(const s of stations){const btn=document.createElement('button');btn.className='stationCardBtn';btn.type='button';btn.innerHTML='<span class="stationIcon">'+iconSvg('substation')+'</span><span class="stationTitle">'+esc(s.nombre)+'</span><span class="chev">›</span>';btn.onclick=()=>openStation(s.clave);cont.appendChild(btn)}}

async function importFiles(files,forcedCode=""){const csv=[...files].filter(f=>f.name.toLowerCase().endsWith('.csv'));if(!csv.length){toast('No se encontraron archivos CSV.');return}const existing=await getAll(STORE_TESTS),names=new Set(existing.map(p=>norm(p.nombre))),hashes=new Set(existing.map(p=>p.hash).filter(Boolean));let added=0,dup=0,invalid=0,mismatch=0;for(const f of csv){try{const code=extractStationCode(f.name);if(!code){invalid++;continue}if(forcedCode&&code!==forcedCode.toUpperCase()){mismatch++;continue}const texto=await f.text(),pts=csvPuntos(texto);if(!pts.length){invalid++;continue}const h=await hash(texto),n=norm(f.name);if(names.has(n)||hashes.has(h)){dup++;continue}const fecha=extractDate(f.name);await ensureStation(code);await addOne(STORE_TESTS,{nombre:f.name,contenido:texto,hash:h,importado:Date.now(),muestras:pts.length,duracion:pts[pts.length-1][0],subestacion:code,fecha});names.add(n);hashes.add(h);added++}catch{invalid++}}await renderStations();if(currentStationKey&&$("#stationOverlay").classList.contains('active'))await renderStationDetail();let msg=added+' '+(added===1?'importada':'importadas');if(dup)msg+=' · '+dup+' duplicada'+(dup===1?'':'s');if(mismatch)msg+=' · '+mismatch+' de otra S.E.';if(invalid)msg+=' · '+invalid+' omitida'+(invalid===1?'':'s');toast(msg,2800)}

async function historyForStation(clave){const code=clave.toUpperCase(),tests=(await getAll(STORE_TESTS)).filter(t=>testStationCode(t)===code),records=(await getAll(STORE_RECORDS)).filter(r=>r.clave===clave),map=new Map();function get(date){const k=date||'';if(!map.has(k))map.set(k,{fecha:date||'',tests:[],record:null});return map.get(k)}for(const t of tests)get(t.fecha||extractDate(t.nombre)).tests.push(t);for(const r of records)get(r.fecha).record=r;return [...map.values()].sort((a,b)=>{if(!a.fecha)return 1;if(!b.fecha)return-1;return b.fecha.localeCompare(a.fecha)})}
async function openStation(clave){currentStationKey=clave;const s=await getOne(STORE_STATIONS,clave);if(!s)return;$("#stationOverlayTitle").textContent=s.nombre;await renderStationDetail();openOverlay('stationOverlay')}
function infoItem(label,value){return'<div class="infoItem"><small>'+esc(label)+'</small><strong>'+(String(value||'').trim()?esc(value):'—')+'</strong></div>'}
async function renderStationDetail(){const s=await getOne(STORE_STATIONS,currentStationKey);if(!s)return;const b=s.banco||{},c=s.cargador||{},hist=await historyForStation(s.clave);let html='<div class="heroCode">'+esc(s.nombre)+'</div><div class="heroFullName">'+esc(s.nombreCompleto||fullStationName(s.nombre))+'</div><div class="sectionLabel">Banco y cargador</div><div class="infoCard"><div class="infoGrid">'+infoItem('Marca',b.marca)+infoItem('Tipo',b.tipo)+infoItem('Capacidad',b.capacidad?b.capacidad+' Ah':'')+infoItem('Año',b.anio)+infoItem('Celdas',b.numCeldas||'')+infoItem('Construcción',b.sellada?'Sellada':'Abierta')+'<div class="infoWide" style="height:1px;background:var(--line);margin:2px 0"></div>'+infoItem('Cargador',c.marca)+infoItem('Modelo',c.modelo)+infoItem('Capacidad',c.capacidad)+infoItem('Serie',c.serie)+'</div></div><div class="sectionLabel">Historial</div><div id="stationHistory"></div>';$("#stationOverlayBody").innerHTML=html;const h=$("#stationHistory");if(!hist.length){h.innerHTML='<div class="empty">No hay registros todavía.</div>'}else for(const item of hist){const wrap=document.createElement('div');wrap.className='historySwipe';const del=document.createElement('button');del.className='historyDelete';del.type='button';del.textContent='Eliminar';del.onclick=e=>{e.stopPropagation();deleteHistoryDate(s.clave,item.fecha)};const btn=document.createElement('button');btn.className='historyItem';btn.type='button';btn.innerHTML='<span class="historyDate">'+esc(fechaBonita(item.fecha))+'</span><span class="chev">›</span>';btn.onclick=()=>{if(btn.classList.contains('open')){btn.classList.remove('open');return}openRecord(s.clave,item.fecha,item.tests[0]?.id||null)};attachSwipeRow(wrap,btn);wrap.append(del,btn);h.appendChild(wrap)}}


function attachSwipeRow(container,row){let sx=0,sy=0,dx=0,tracking=false;container.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const t=e.touches[0];sx=t.clientX;sy=t.clientY;dx=0;tracking=true},{passive:true});container.addEventListener('touchmove',e=>{if(!tracking||e.touches.length!==1)return;const t=e.touches[0],dy=t.clientY-sy;dx=t.clientX-sx;if(Math.abs(dx)>Math.abs(dy)&&dx<0){if(e.cancelable)e.preventDefault();row.style.transform='translateX('+Math.max(-96,dx)+'px)'}},{passive:false});const finish=()=>{if(!tracking)return;tracking=false;row.style.transform='';if(dx<-52)row.classList.add('open');else row.classList.remove('open')};container.addEventListener('touchend',finish);container.addEventListener('touchcancel',finish)}
async function deleteHistoryDate(clave,fecha){if(!confirm('¿Eliminar el registro del '+fechaBonita(fecha)+'?'))return;const tests=await getAll(STORE_TESTS);for(const t of tests){if(testStationCode(t)===clave.toUpperCase()&&(t.fecha||extractDate(t.nombre))===fecha)await delOne(STORE_TESTS,t.id)}await delOne(STORE_RECORDS,recordId(clave,fecha));toast('Registro eliminado.');await renderStationDetail();await renderSettings()}

async function openStationEditor(clave,isNew=false){editingNewStation=isNew;editingStationKey=clave;let s=isNew?defaultStation(''):await getOne(STORE_STATIONS,clave);if(!s)return;const b=s.banco||{},c=s.cargador||{},existing=new Set((await getAll(STORE_STATIONS)).filter(x=>validCode(String(x.nombre||x.clave||"").toUpperCase())).map(x=>String(x.nombre||x.clave).toUpperCase()));const available=VALID_CODES.filter(code=>!existing.has(code)||code===s.nombre);if(isNew&&!available.length){toast('Ya están creadas todas las subestaciones válidas.');return}const stationField=isNew?'<div class="field"><label>Subestación</label><select id="fStationName">'+available.map(code=>'<option value="'+code+'">'+code+' — '+esc(fullStationName(code))+'</option>').join('')+'</select></div>':'<div class="field"><label>Subestación</label><input id="fStationName" value="'+esc(s.nombre)+'" readonly></div><div class="field"><label>Nombre</label><input value="'+esc(s.nombreCompleto||fullStationName(s.nombre))+'" readonly></div>';$("#stationForm").innerHTML='<div class="formSection"><div class="formTitle">Subestación</div><div class="formCard">'+stationField+'</div></div><div class="formSection"><div class="formTitle">Banco de baterías</div><div class="formCard"><div class="field"><label>Marca</label><input id="fBatteryBrand" value="'+esc(b.marca)+'"></div><div class="field"><label>Tipo</label><input id="fBatteryType" value="'+esc(b.tipo)+'"></div><div class="field"><label>Capacidad (Ah)</label><input id="fBatteryCapacity" inputmode="decimal" value="'+esc(b.capacidad)+'"></div><div class="field"><label>Año</label><input id="fBatteryYear" inputmode="numeric" value="'+esc(b.anio)+'"></div><div class="field"><label>Número de celdas</label><input id="fCellCount" type="number" min="1" max="200" inputmode="numeric" value="'+esc(b.numCeldas||60)+'"></div><div class="field"><label>Construcción</label><select id="fSealed"><option value="0" '+(!b.sellada?'selected':'')+'>Abierta</option><option value="1" '+(b.sellada?'selected':'')+'>Sellada</option></select></div></div></div><div class="formSection"><div class="formTitle">Cargador</div><div class="formCard"><div class="field"><label>Marca</label><input id="fChargerBrand" value="'+esc(c.marca)+'"></div><div class="field"><label>Modelo</label><input id="fChargerModel" value="'+esc(c.modelo)+'"></div><div class="field"><label>Capacidad</label><input id="fChargerCapacity" value="'+esc(c.capacidad)+'"></div><div class="field"><label>N.º de serie</label><input id="fChargerSerial" value="'+esc(c.serie)+'"></div></div></div>';openSheet('stationSheet')}
async function saveStation(){const code=String($("#fStationName").value||"").toUpperCase();if(!validCode(code)){toast('Selecciona una subestación válida.');return}const clave=editingNewStation?norm(code):editingStationKey;if(editingNewStation&&await getOne(STORE_STATIONS,clave)){toast('Esa subestación ya existe.');return}const s=editingNewStation?defaultStation(code):await getOne(STORE_STATIONS,clave);s.nombre=code;s.nombreCompleto=fullStationName(code);s.banco={marca:$("#fBatteryBrand").value.trim(),tipo:$("#fBatteryType").value.trim(),capacidad:$("#fBatteryCapacity").value.trim(),anio:$("#fBatteryYear").value.trim(),numCeldas:Math.max(1,Number($("#fCellCount").value)||60),sellada:$("#fSealed").value==='1'};s.cargador={marca:$("#fChargerBrand").value.trim(),modelo:$("#fChargerModel").value.trim(),capacidad:$("#fChargerCapacity").value.trim(),serie:$("#fChargerSerial").value.trim()};s.actualizado=Date.now();await putOne(STORE_STATIONS,s);closeSheet('stationSheet');toast('Subestación guardada.');await renderStations();if(currentStationKey===clave)await renderStationDetail()}

function fv(v){return v===null||v===undefined||v===""||!Number.isFinite(Number(v))?"--":Number(v).toFixed(2)+" V"}
function ft(s){if(s===null||s===undefined||!Number.isFinite(Number(s)))return"--";const n=Math.max(0,Math.round(Number(s)));return Math.floor(n/60)+":"+String(n%60).padStart(2,"0")+" min"}
function valorSegundo(d,s){for(const p of d)if(Number(p[0])===s)return p[1];return null}
function regresion(d,a,b){const n=b-a+1;if(n<2)return null;let sx=0,sy=0,sxy=0,sxx=0,x0=d[a][0];for(let i=a;i<=b;i++){const x=d[i][0]-x0,y=d[i][1];sx+=x;sy+=y;sxy+=x*y;sxx+=x*x}const den=n*sxx-sx*sx;if(Math.abs(den)<1e-6)return null;const m=(n*sxy-sx*sy)/den,c=(sy-m*sx)/n,xf=d[b][0]-x0;return{pendiente:m,valor:c+m*xf}}
function estabilidad(d){const V=60,R=1,U=.15,S=120;if(d.length<V)return{confirmada:false,voltaje:null,tiempo:null};const ps=new Array(d.length).fill(null),vs=new Array(d.length).fill(null);for(let i=V-1;i<d.length;i++){const g=regresion(d,i-V+1,i);if(g){ps[i]=g.pendiente*60;vs[i]=g.valor}}let min=d[0][1],imin=0,rec=false,c=0;for(let i=1;i<d.length;i++){if(d[i][1]<min){min=d[i][1];imin=i;rec=false;c=0}if(i<=imin)continue;if(!rec){if(d[i][1]-min>=R)rec=true;else continue}if(ps[i]!==null&&Math.abs(ps[i])<=U){c++;if(c>=S)return{confirmada:true,voltaje:vs[i]!==null?vs[i]:d[i][1],tiempo:d[i][0]}}else c=0}return{confirmada:false,voltaje:null,tiempo:null}}
function analizar(d){if(!d.length)return{};let min=Number(d[0][1]),tmin=Number(d[0][0]);for(let i=1;i<d.length;i++){const v=Number(d[i][1]);if(Number.isFinite(v)&&v<min){min=v;tmin=Number(d[i][0])}}const e=estabilidad(d),meseta=e.confirmada?Number(e.voltaje):null,te=e.confirmada?Number(e.tiempo):null,rec=e.confirmada&&Number.isFinite(meseta)?meseta-min:null;return{minimo:min,tiempoMinimo:tmin,meseta,tiempoEstabilizacion:te,recuperacion:rec,estabilizada:e.confirmada}}
function drawChart(canvas,d){const x=canvas.getContext("2d"),W=canvas.width,H=canvas.height,L=66,R=18,T=20,B=50,aw=W-L-R,ah=H-T-B;const TMAX=Math.max(1800,d.length?Math.ceil(d[d.length-1][0]/300)*300:1800);let vmin=117,vmax=132;if(d.length){let mi=d[0][1],ma=d[0][1];for(let i=1;i<d.length;i++){mi=Math.min(mi,d[i][1]);ma=Math.max(ma,d[i][1])}if(mi<117)vmin=Math.floor(mi/5)*5;if(ma>132)vmax=Math.ceil(ma/5)*5}if(vmax-vmin<10)vmin=vmax-10;x.clearRect(0,0,W,H);x.fillStyle="white";x.fillRect(0,0,W,H);x.font="14px Arial";const rango=vmax-vmin;let pv=1;if(rango>20&&rango<=30)pv=2;if(rango>30)pv=5;const primero=Math.ceil(vmin/pv)*pv;for(let v=primero;v<=vmax+.001;v+=pv){const y=T+((vmax-v)/(vmax-vmin))*ah;x.strokeStyle="#ddd";x.lineWidth=1;x.beginPath();x.moveTo(L,y);x.lineTo(L+aw,y);x.stroke();x.fillStyle="black";x.textAlign="right";x.fillText(v.toFixed(0)+" V",L-6,y+5)}const mm=Math.ceil(TMAX/60),pm=mm<=30?5:(mm<=60?10:15);for(let m=0;m<=mm;m+=pm){const s=m*60,xx=L+(s/TMAX)*aw;x.strokeStyle="#ddd";x.beginPath();x.moveTo(xx,T);x.lineTo(xx,T+ah);x.stroke();x.fillStyle="black";x.textAlign="center";x.fillText(m+"m",xx,H-18)}x.strokeStyle="black";x.lineWidth=2;x.beginPath();x.moveTo(L,T);x.lineTo(L,T+ah);x.lineTo(L+aw,T+ah);x.stroke();if(!d.length)return;const X=s=>L+(s/TMAX)*aw,Y=v=>T+((vmax-v)/(vmax-vmin))*ah;x.lineWidth=1.5;for(let i=1;i<d.length;i++){const[t1,v1]=d[i-1],[t2,v2]=d[i];x.strokeStyle=((v1+v2)/2<=110)?"red":"blue";x.beginPath();x.moveTo(X(t1),Y(v1));x.lineTo(X(t2),Y(v2));x.stroke()}}
function resultRow(k,v){return'<div class="resultRow"><span>'+esc(k)+'</span><span class="resultValue">'+esc(v)+'</span></div>'}

async function openRecord(clave,fecha,testId=null){currentStationKey=clave;currentRecordDate=fecha||'';currentRecordTestId=testId;await renderRecordDetail();openOverlay('recordOverlay')}
function renderReadings(r,b){const sealed=!!b.sellada,rows=(r.lecturas||[]).map(x=>'<div class="readingLine '+(sealed?'sealed':'')+'"><div class="cellNo">'+esc(x.celda)+'</div><div>'+esc(x.voltaje||'—')+'</div>'+(sealed?'':'<div>'+esc(x.densidad||'—')+'</div>')+'<div>'+esc(x.temperatura||'—')+'</div></div>').join('');const water=(r.lecturas||[]).filter(x=>x.agua&&Number(x.agua)!==0);let body='<div class="readingsCard"><div class="readingTableWrap"><div class="readingHead '+(sealed?'sealed':'')+'"><div>Celda</div><div>Voltaje</div>'+(sealed?'':'<div>Densidad</div>')+'<div>°C</div></div>'+rows+'</div></div>';if(!sealed&&water.length){body+='<div class="waterList"><h3>Reposición de agua</h3>'+water.map(x=>'<div class="waterRow"><span>Celda '+esc(x.celda)+'</span><strong>'+esc(x.agua)+' L</strong></div>').join('')+'</div>'}body+='</div>';return '<details class="readingsDetails"><summary>Lecturas por celda</summary><div class="readingsDetailsBody">'+body+'</div></details>'}
async function renderRecordDetail(){const s=await getOne(STORE_STATIONS,currentStationKey);if(!s)return;const hist=await historyForStation(currentStationKey),item=hist.find(x=>x.fecha===currentRecordDate)||{fecha:currentRecordDate,tests:[],record:null};if(currentRecordTestId){const exact=item.tests.find(t=>Number(t.id)===Number(currentRecordTestId));if(exact)item.tests=[exact,...item.tests.filter(t=>t!==exact)]}const r=item.record,b=s.banco||{};$("#recordOverlayTitle").textContent=s.nombre;let html='<div class="recordDate">'+esc(fechaBonita(currentRecordDate))+'</div><div class="actionRow"><button id="editReadingsAction" class="circleEdit '+(r?'':'primary')+'" type="button" aria-label="'+(r?'Editar lecturas':'Agregar lecturas')+'">'+iconSvg(r?'pencil':'plus')+'</button></div>';if(item.tests.length){const t=item.tests[0],d=csvPuntos(t.contenido||''),a=analizar(d);html+='<div class="subsectionHeader">Prueba de descarga</div><div class="chartCard"><canvas id="recordChart" width="1200" height="900"></canvas><div id="recordStability" class="stability">ESTABILIZADO — '+(a.meseta!==null&&a.meseta!==undefined?Number(a.meseta).toFixed(2)+' V':'')+'</div></div><div class="subsectionHeader">Resultados</div><div class="resultCard">'+resultRow('1 min',fv(valorSegundo(d,60)))+resultRow('10 min',fv(valorSegundo(d,600)))+resultRow('20 min',fv(valorSegundo(d,1200)))+resultRow('30 min',fv(valorSegundo(d,1800)))+'</div><div class="subsectionHeader">Información de estabilización</div><div class="resultCard">'+resultRow('Mínimo',fv(a.minimo))+resultRow('Tiempo del mínimo',ft(a.tiempoMinimo))+resultRow('Meseta',fv(a.meseta))+resultRow('Tiempo de estabilización',ft(a.tiempoEstabilizacion))+resultRow('Recuperación',a.recuperacion===null||a.recuperacion===undefined?'--':(a.recuperacion>=0?'+':'')+Number(a.recuperacion).toFixed(2)+' V')+'</div>'}else html+='<div class="subsectionHeader">Prueba de descarga</div><div class="empty">Sin descarga cargada.</div>';if(r){const filled=(r.lecturas||[]).filter(x=>x.voltaje||x.densidad||x.temperatura||x.agua).length;html+='<div class="subsectionHeader">Lecturas en flotación</div><div class="readingSummary"><div class="readingStats"><div class="stat"><small>Banco</small><strong>'+(r.voltajeBanco?esc(r.voltajeBanco)+' V':'—')+'</strong></div><div class="stat"><small>Celdas</small><strong>'+filled+' / '+esc(b.numCeldas||60)+'</strong></div><div class="stat"><small>Tipo</small><strong>'+(b.sellada?'Sellada':'Abierta')+'</strong></div></div>'+(r.observaciones?'<div style="margin-top:13px;color:var(--muted);font-size:15px">'+esc(r.observaciones)+'</div>':'')+'</div>'+renderReadings(r,b)}else html+='<div class="subsectionHeader">Lecturas en flotación</div><div class="empty">Sin lecturas capturadas.</div>';$("#recordOverlayBody").innerHTML=html;$("#editReadingsAction").onclick=()=>openCapture(currentStationKey,currentRecordDate||todayISO());if(item.tests.length){const d=csvPuntos(item.tests[0].contenido||'');requestAnimationFrame(()=>{const c=$("#recordChart");if(c)drawChart(c,d);const a=analizar(d),e=$("#recordStability");if(e)e.style.display=a.estabilizada?'block':'none'})}}

async function openCapture(clave,fecha){const s=await getOne(STORE_STATIONS,clave);if(!s)return;const b=s.banco||{},id=recordId(clave,fecha),r=await getOne(STORE_RECORDS,id)||{id,clave,subestacion:s.nombre,fecha,voltajeBanco:'',observaciones:'',lecturas:[]};const count=Math.max(1,Number(b.numCeldas)||60),sealed=!!b.sellada,by=new Map((r.lecturas||[]).map(x=>[Number(x.celda),x])),lecturas=[];for(let i=1;i<=count;i++){const x=by.get(i)||{celda:i,voltaje:'',densidad:'',temperatura:'',agua:''};lecturas.push({celda:i,voltaje:x.voltaje||'',densidad:x.densidad||'',temperatura:x.temperatura||'',agua:x.agua||''})}captureState={clave,station:s,sealed,count,stage:'voltage',index:0,record:{id,fecha:r.fecha||fecha,voltajeBanco:r.voltajeBanco||'',observaciones:r.observaciones||'',lecturas}};renderCapture();openSheet('captureSheet')}
function persistCapture(){if(!captureState)return;const cs=captureState,row=cs.record.lecturas[cs.index];cs.record.fecha=$("#capDate")?.value||cs.record.fecha;cs.record.voltajeBanco=$("#capBankVoltage")?.value.trim()||'';cs.record.observaciones=$("#capNotes")?.value.trim()||'';if(!row)return;if(cs.stage==='voltage'){row.voltaje=$("#capVolt")?.value.trim()||''}else{if(!cs.sealed)row.densidad=$("#capDens")?.value.trim()||'';row.temperatura=$("#capTemp")?.value.trim()||'';if(!cs.sealed)row.agua=$("#capWater")?.value.trim()||''}}
function renderCapture(){if(!captureState)return;const cs=captureState,row=cs.record.lecturas[cs.index],stage2=cs.stage==='density',progress=stage2?(cs.count+cs.index+1)/(cs.count*2):(cs.index+1)/(cs.count*2);const fields=!stage2?'<div class="captureField"><label>Voltaje</label><input id="capVolt" inputmode="decimal" placeholder="V" value="'+esc(row.voltaje)+'"></div>':('<div class="capturePair">'+(!cs.sealed?'<div class="captureField"><label>Densidad</label><input id="capDens" inputmode="decimal" placeholder="Densidad" value="'+esc(row.densidad)+'"></div>':'')+'<div class="captureField"><label>Temperatura</label><input id="capTemp" inputmode="decimal" placeholder="°C" value="'+esc(row.temperatura)+'"></div></div>'+(cs.sealed?'':'<div class="captureField"><label>Agua agregada <span style="color:var(--muted);font-weight:600">(opcional)</span></label><input id="capWater" inputmode="decimal" placeholder="L" value="'+esc(row.agua)+'"></div>'));$("#captureBody").innerHTML='<div class="captureWizard"><div class="captureMeta"><div class="field"><label>Fecha</label><input id="capDate" type="date" value="'+esc(cs.record.fecha)+'"></div><div class="field"><label>Voltaje del banco</label><input id="capBankVoltage" inputmode="decimal" placeholder="V" value="'+esc(cs.record.voltajeBanco)+'"></div><div class="field"><label>Observaciones</label><textarea id="capNotes" placeholder="Opcional">'+esc(cs.record.observaciones)+'</textarea></div></div><div class="captureStep"><div class="captureStage">'+(stage2?(cs.sealed?'TEMPERATURA':'DENSIDAD Y TEMPERATURA'):'VOLTAJE')+'</div><div class="captureCell">Celda '+row.celda+' de '+cs.count+'</div><div class="captureProgress"><span style="width:'+Math.max(3,Math.round(progress*100))+'%"></span></div>'+fields+'<div class="captureActions"><button id="capPrev" class="captureBtn" type="button">Anterior</button><button id="capNext" class="captureBtn primary" type="button">'+(stage2&&cs.index===cs.count-1?'Finalizar':'Siguiente')+'</button></div></div></div>';$("#capPrev").onclick=prevCapture;$("#capNext").onclick=nextCapture;setTimeout(()=>{const target=!stage2?$("#capVolt"):(cs.sealed?$("#capTemp"):$("#capDens"));target?.focus()},40)}
function nextCapture(){if(!captureState)return;persistCapture();const cs=captureState;if(cs.stage==='voltage'){if(cs.index<cs.count-1)cs.index++;else{cs.stage='density';cs.index=0}}else if(cs.index<cs.count-1)cs.index++;else{saveCapture();return}renderCapture()}
function prevCapture(){if(!captureState)return;persistCapture();const cs=captureState;if(cs.stage==='density'&&cs.index===0){cs.stage='voltage';cs.index=cs.count-1}else if(cs.index>0)cs.index--;renderCapture()}
async function saveCapture(){if(!captureState)return;persistCapture();const cs=captureState,newDate=cs.record.fecha||todayISO(),newId=recordId(cs.clave,newDate),rec={id:newId,clave:cs.clave,subestacion:cs.station.nombre,fecha:newDate,voltajeBanco:cs.record.voltajeBanco,observaciones:cs.record.observaciones,lecturas:cs.record.lecturas,actualizado:Date.now()};await putOne(STORE_RECORDS,rec);if(cs.record.id!==newId)await delOne(STORE_RECORDS,cs.record.id);currentRecordDate=newDate;captureState=null;closeSheet('captureSheet');toast('Lecturas guardadas.');if($("#recordOverlay").classList.contains('active'))await renderRecordDetail();if($("#stationOverlay").classList.contains('active'))await renderStationDetail();await renderStations()}

function openOverlay(id){const e=$("#"+id);e.classList.add('active');e.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeOverlay(id){const e=$("#"+id);e.classList.remove('active');e.setAttribute('aria-hidden','true');e.style.transform='';e.style.opacity='';document.body.style.overflow=$$('.overlay.active').length?'hidden':'';if(id==='stationOverlay')currentStationKey=null}
function openSheet(id){const e=$("#"+id);e.classList.add('active');e.setAttribute('aria-hidden','false')}
function closeSheet(id){const e=$("#"+id);e.classList.remove('active');e.setAttribute('aria-hidden','true')}
function installSwipeUpBack(id){const e=$("#"+id);let sy=null,sx=null,tracking=false;e.addEventListener('touchstart',ev=>{if(!e.classList.contains('active')||ev.touches.length!==1)return;const t=ev.touches[0];if(t.clientY<window.innerHeight-140)return;sy=t.clientY;sx=t.clientX;tracking=true;e.classList.remove('animating')},{passive:true});e.addEventListener('touchmove',ev=>{if(!tracking||ev.touches.length!==1)return;const t=ev.touches[0],dy=t.clientY-sy,dx=t.clientX-sx;if(dy<0&&Math.abs(dy)>Math.abs(dx)*1.2){if(ev.cancelable)ev.preventDefault();e.style.transform='translateY('+Math.max(-130,dy*.38)+'px)';e.style.opacity=String(Math.max(.70,1+dy/700))}},{passive:false});e.addEventListener('touchend',ev=>{if(!tracking)return;tracking=false;const t=ev.changedTouches[0],dy=t.clientY-sy,dx=t.clientX-sx;e.classList.add('animating');if(dy<-90&&Math.abs(dy)>Math.abs(dx)*1.15){e.style.transform='translateY(-150px)';e.style.opacity='0';setTimeout(()=>{closeOverlay(id);e.classList.remove('animating')},210)}else{e.style.transform='translateY(0)';e.style.opacity='1';setTimeout(()=>e.classList.remove('animating'),220)}})}
function installRecordHorizontalNav(){const overlay=$("#recordOverlay"),body=$("#recordOverlayBody");let sx=0,sy=0,dx=0,dy=0,tracking=false;overlay.addEventListener('touchstart',ev=>{if(!overlay.classList.contains('active')||ev.touches.length!==1||$("#captureSheet").classList.contains('active'))return;const t=ev.touches[0];sx=t.clientX;sy=t.clientY;dx=0;dy=0;tracking=true;body.style.transition='none'},{passive:true});overlay.addEventListener('touchmove',ev=>{if(!tracking||ev.touches.length!==1)return;const t=ev.touches[0];dx=t.clientX-sx;dy=t.clientY-sy;if(Math.abs(dx)>Math.abs(dy)*1.2){if(ev.cancelable)ev.preventDefault();body.style.transform='translateX('+Math.max(-95,Math.min(95,dx))+'px)';body.style.opacity=String(Math.max(.58,1-Math.abs(dx)/260))}},{passive:false});overlay.addEventListener('touchend',async()=>{if(!tracking)return;tracking=false;body.style.transition='transform .22s ease, opacity .22s ease';if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.2){const offset=dx<0?1:-1;const target=await getAdjacentHistory(offset);if(target){body.style.transform='translateX('+(dx<0?-140:140)+'px)';body.style.opacity='0.22';setTimeout(async()=>{currentRecordDate=target.fecha;currentRecordTestId=target.testId;await renderRecordDetail();body.style.transition='none';body.style.transform='translateX('+(dx<0?140:-140)+'px)';body.style.opacity='0.22';requestAnimationFrame(()=>{body.style.transition='transform .22s ease, opacity .22s ease';body.style.transform='translateX(0)';body.style.opacity='1'})},150);return}}body.style.transform='translateX(0)';body.style.opacity='1'})}

async function renderSettings(){const tests=await getAll(STORE_TESTS),stations=(await getAll(STORE_STATIONS)).filter(s=>validCode(String(s.nombre||s.clave||"").toUpperCase())),records=await getAll(STORE_RECORDS);$("#versionValue").textContent=APP_VERSION;$("#countTests").textContent=tests.filter(t=>!!testStationCode(t)).length;$("#countStations").textContent=stations.length;$("#countRecords").textContent=records.length;if(swRegistration?.waiting){swUpdateReady=true;$("#updateStatus").textContent='Actualización lista';$("#btnUpdate").textContent='Actualizar'}else if(!swUpdateReady){$("#updateStatus").textContent='Buscar una versión nueva';$("#btnUpdate").textContent='Comprobar'}}
async function checkUpdate(){if(!('serviceWorker'in navigator)){toast('Las actualizaciones automáticas no están disponibles.');return}try{if(!swRegistration)swRegistration=await navigator.serviceWorker.getRegistration();if(swRegistration?.waiting){swRegistration.waiting.postMessage({type:'SKIP_WAITING'});return}$("#updateStatus").textContent='Buscando…';$("#btnUpdate").textContent='Buscando';await swRegistration?.update();await new Promise(r=>setTimeout(r,1200));if(swRegistration?.waiting){swUpdateReady=true;$("#updateStatus").textContent='Actualización lista';$("#btnUpdate").textContent='Actualizar';toast('Actualización disponible.')}else{$("#updateStatus").textContent='DC Viewer está actualizado';$("#btnUpdate").textContent='Comprobar';toast('No se encontró una versión nueva.')}}catch{$("#updateStatus").textContent='No se pudo comprobar';$("#btnUpdate").textContent='Reintentar'}}
async function setupSW(){if(!('serviceWorker'in navigator))return;try{swRegistration=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});swRegistration.addEventListener('updatefound',()=>{const w=swRegistration.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){swUpdateReady=true;if(currentTab==='ajustes')renderSettings();toast('Actualización disponible en Ajustes.')}})});navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload())}catch{}}

$$('.navBtn').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$("#folderPicker").onchange=async e=>{const f=[...e.target.files];e.target.value='';if(f.length)await importFiles(f)};
$("#singleFilePicker").onchange=async e=>{const f=[...e.target.files];e.target.value='';if(!f.length||!pendingImportStationKey)return;const s=await getOne(STORE_STATIONS,pendingImportStationKey);if(s)await importFiles(f,s.nombre);pendingImportStationKey=null;closeSheet('actionSheet')};
$("#stationAddFab").onclick=()=>openSheet('actionSheet');
$("#btnLoadDischarge").onclick=()=>{pendingImportStationKey=currentStationKey;$("#singleFilePicker").click()};
$("#btnCapture").onclick=()=>{closeSheet('actionSheet');openCapture(currentStationKey,todayISO())};
$("#editStationBtn").onclick=()=>openStationEditor(currentStationKey,false);
$("#saveStationBtn").onclick=saveStation;
$("#saveCaptureBtn").onclick=saveCapture;
$("#btnUpdate").onclick=checkUpdate;
$$('[data-close]').forEach(b=>b.onclick=()=>closeOverlay(b.dataset.close));
$$('[data-sheet-close]').forEach(b=>b.onclick=()=>closeSheet(b.dataset.sheetClose));
installSwipeUpBack('stationOverlay');installSwipeUpBack('recordOverlay');installRecordHorizontalNav();
window.addEventListener('resize',()=>{const c=$("#recordChart");if(c&&currentStationKey&&currentRecordDate)renderRecordDetail()});
(async()=>{try{await openDB();await migrateLegacy();await renderStations();await renderSettings();renderTopActions();await setupSW()}catch(e){console.error(e);toast('No se pudo abrir el almacenamiento local.',3000)}})();
</script>
