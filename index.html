<!DOCTYPE html>
<html lang="es">
<head>

<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;padding:max(18px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom));background:#101010;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.contenedor{max-width:820px;margin:0 auto}
.tituloPrincipal{text-align:center;font-size:22px;font-weight:800;letter-spacing:.5px;line-height:1.25;margin:12px 42px 22px}
.panel,.panelVisor{background:#202020;border:1px solid #2b2b2b;border-radius:14px;padding:14px}
.cabeceraLista{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.cabeceraLista strong{font-size:17px;letter-spacing:.5px}

.accionesCabecera{display:flex;gap:8px}
.botonIcono svg{width:23px;height:23px}
.barraBusqueda{display:none;align-items:center;gap:8px;margin:-2px 0 12px}
.barraBusqueda.visible{display:flex}
.campoBusqueda{flex:1;min-width:0;height:44px;border:1px solid #505050;border-radius:10px;background:#161616;color:#fff;padding:0 12px;font-size:16px;outline:none}
.campoBusqueda:focus{border-color:#9a9a9a}
.limpiarBusqueda{display:none;width:38px;height:38px;border:0;border-radius:9px;background:#3a3a3a;color:#fff;font-size:23px;line-height:1;cursor:pointer}
.limpiarBusqueda.visible{display:inline-flex;align-items:center;justify-content:center}
.grupoCarpeta{display:flex;flex-direction:column;gap:7px}
.carpeta{width:100%;display:flex;align-items:center;gap:11px;text-align:left;background:#292929;border:1px solid #484848;color:#fff;border-radius:10px;padding:11px 12px;cursor:pointer}
.carpeta:active{transform:scale(.995)}
.carpetaIcono{width:27px;height:27px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.carpetaIcono svg{width:27px;height:27px}
.carpetaTexto{flex:1;min-width:0}
.carpetaNombre{display:block;font-size:16px;font-weight:800;word-break:break-word}
.carpetaMeta{display:block;color:#aaa;font-size:12px;margin-top:3px}
.carpetaFlecha{font-size:27px;line-height:1;color:#bbb;transition:transform .16s ease}
.grupoCarpeta.abierta .carpetaFlecha{transform:rotate(90deg)}
.contenidoCarpeta{display:none;flex-direction:column;gap:7px;padding-left:17px}
.grupoCarpeta.abierta .contenidoCarpeta{display:flex}
.contenidoCarpeta .archivo{background:#262626}

.botonIcono{width:46px;height:46px;border:0;border-radius:11px;background:#eee;color:#111;font-size:27px;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.botonIcono:active{transform:scale(.96)}.botonIcono.activo{background:#00c853;color:#07130a}
.lista{display:flex;flex-direction:column;gap:8px}
.filaPrueba{display:flex;align-items:center;gap:9px}
.selectorPrueba{display:none;width:24px;height:24px;accent-color:#00c853;flex:0 0 auto}
.modoSeleccion .selectorPrueba{display:block}
.archivo{flex:1;min-width:0;text-align:left;background:#2b2b2b;border:1px solid #444;color:#fff;border-radius:10px;padding:12px;cursor:pointer}
.archivo.seleccionado{border-color:#00c853;box-shadow:0 0 0 1px #00c853 inset}
.archivoNombre{font-size:16px;font-weight:750;word-break:break-word}.archivoMeta{color:#aaa;font-size:12px;margin-top:5px}
.accionesSeleccion{display:none;margin-top:14px;text-align:center}
.accionesSeleccion.visible{display:block}
.botonBorrarSeleccion{
      width:58px;
      height:54px;
      border:0;
      border-radius:10px;
      background:#ff5252;
      color:#fff;
      padding:0;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
.botonBorrarSeleccion:disabled{opacity:.35}
.vacio{text-align:center;color:#999;padding:22px 6px}input[type=file]{display:none}
#visor{display:none;position:fixed;inset:0;z-index:1000;overflow-y:auto;background:#101010;padding:max(66px,calc(env(safe-area-inset-top) + 52px)) 8px max(22px,env(safe-area-inset-bottom))}
#visor.activo{display:block}.visorContenido{position:relative;z-index:1;transition:transform .22s ease;will-change:transform;max-width:1040px;margin:0 auto}

.visorPreview{
  position:absolute;
  z-index:2;
  pointer-events:none;
  will-change:transform;
  margin:0;
}
.visorPreview canvas{pointer-events:none}

.cerrarVisor{position:fixed;top:max(12px,env(safe-area-inset-top));right:14px;z-index:1100;width:46px;height:46px;border:0;border-radius:50%;background:#eee;color:#111;font-size:27px;font-weight:700;line-height:1;cursor:pointer}
#nombrePrueba{text-align:center;font-size:18px;font-weight:750;word-break:break-word;margin:0 50px 16px}
.panelVisor{margin-bottom:14px}canvas{display:block;width:100%;height:auto;min-height:360px;background:white;border-radius:10px}
.estabilidad{display:none;margin-top:12px;padding:10px 12px;border-radius:8px;background:#2b2b2b;text-align:center;font-size:18px;font-weight:bold}
.resultado{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #555;padding:9px 0;font-size:18px}.resultado:last-child{border-bottom:0}.valor{font-weight:700;white-space:nowrap}.separador{height:14px}
.mensaje{display:none;position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#333;color:white;border:1px solid #555;padding:10px 14px;border-radius:9px;z-index:2000;max-width:90%;text-align:center}
@media(max-width:520px){
body{padding-left:12px;padding-right:12px}
.panel{padding:12px}
.panelVisor{padding:6px}
.resultado{font-size:17px}
.tituloPrincipal{font-size:20px}
#visor{padding-left:4px;padding-right:4px}
#nombrePrueba{margin-left:54px;margin-right:54px}
}
@media(orientation:landscape){
.visorContenido{max-width:1180px}
canvas{min-height:430px}
}
</style>

<body>
<main id="pantallaLista" class="contenedor">
  <div class="tituloPrincipal">PRUEBA DE DESCARGA DE BANCO DE BATERÍAS</div>
  <section class="panel">

          d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-2 6h10l-.8 11H7.8L7 9Zm3 2v7h2v-7h-2Zm4 0v7h2v-7h-2Z"/>

</main>

<section id="visor" aria-hidden="true">
  <button id="btnCerrarVisor" class="cerrarVisor" type="button" aria-label="Cerrar">×</button>
  <div class="visorContenido">
    <div id="nombrePrueba"></div>

    </div>
    <div class="panelVisor">
      <div class="resultado"><span>1 min</span><span id="r1" class="valor">--</span></div>
      <div class="resultado"><span>10 min</span><span id="r10" class="valor">--</span></div>
      <div class="resultado"><span>20 min</span><span id="r20" class="valor">--</span></div>
      <div class="resultado"><span>30 min</span><span id="r30" class="valor">--</span></div>

    </div>

<div id="mensaje" class="mensaje"></div>

<script>
"use strict";
const DB_NAME="Visor130VDB", DB_VERSION=1, STORE="pruebas";
let db=null, pruebaActual=null, puntosActuales=[], modoSeleccion=false, seleccionadas=new Set(), ordenPruebas=[], indicePruebaActual=-1, textoBusqueda="", busquedaVisible=false; const carpetasAbiertas=new Set();

function msg(t,ms=1600){const e=document.getElementById("mensaje");e.textContent=t;e.style.display="block";clearTimeout(msg.timer);msg.timer=setTimeout(()=>{e.style.display="none";e.textContent=""},ms)}
function abrirDB(){return new Promise((ok,no)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE)){const s=d.createObjectStore(STORE,{keyPath:"id",autoIncrement:true});s.createIndex("nombre","nombre",{unique:false});s.createIndex("importado","importado",{unique:false})}};r.onsuccess=()=>{db=r.result;ok(db)};r.onerror=()=>no(r.error)})}
function st(m="readonly"){return db.transaction(STORE,m).objectStore(STORE)}
function guardar(x){return new Promise((ok,no)=>{const r=st("readwrite").add(x);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function todos(){return new Promise((ok,no)=>{const r=st().getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>no(r.error)})}
function uno(id){return new Promise((ok,no)=>{const r=st().get(Number(id));r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error)})}
function borrar(id){return new Promise((ok,no)=>{const r=st("readwrite").delete(Number(id));r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}
async function hash(texto){const b=new TextEncoder().encode(texto),d=await crypto.subtle.digest("SHA-256",b);return Array.from(new Uint8Array(d)).map(x=>x.toString(16).padStart(2,"0")).join("")}
const norm=n=>String(n||"").trim().toLowerCase();


function infoArchivo(nombre){
  const limpio=String(nombre||"").trim();
  const sinExt=limpio.replace(/\.csv$/i,"");
  const m=sinExt.match(/^(.*)_(\d{4}-\d{2}-\d{2})(?:_(\d+))?$/);

  if(m){
    return{
      subestacion:m[1],
      fecha:m[2],
      repeticion:m[3]?Number(m[3]):1
    };
  }

  return{
    subestacion:sinExt,
    fecha:"",
    repeticion:1
  };
}

function claveSubestacion(nombre){
  return norm(infoArchivo(nombre).subestacion);
}

function coincideBusqueda(p,q){
  if(!q)return true;
  const info=infoArchivo(p.nombre);
  const texto=(p.nombre+" "+info.subestacion).toLowerCase();
  return texto.includes(q);
}

function csvPuntos(texto){
  const lineas=texto.replace(/^\uFEFF/,"").split(/\r?\n/),r=[];
  for(const raw of lineas){const l=raw.trim();if(!l)continue;const p=l.split(",");if(p.length<2)continue;const t=parseFloat(p[0]),v=parseFloat(p[1]);if(Number.isFinite(t)&&Number.isFinite(v))r.push([t,v])}
  return r;
}
function valorSegundo(d,s){for(const p of d)if(Number(p[0])===s)return p[1];return null}
function regresion(d,a,b){const n=b-a+1;if(n<2)return null;let sx=0,sy=0,sxy=0,sxx=0,x0=d[a][0];for(let i=a;i<=b;i++){const x=d[i][0]-x0,y=d[i][1];sx+=x;sy+=y;sxy+=x*y;sxx+=x*x}const den=n*sxx-sx*sx;if(Math.abs(den)<1e-6)return null;const m=(n*sxy-sx*sy)/den,c=(sy-m*sx)/n,xf=d[b][0]-x0;return{pendiente:m,valor:c+m*xf}}
function estabilidad(d){
  const V=60,R=1.0,U=.15,S=120;if(d.length<V)return{confirmada:false,voltaje:null,tiempo:null};
  const ps=new Array(d.length).fill(null),vs=new Array(d.length).fill(null);
  for(let i=V-1;i<d.length;i++){const g=regresion(d,i-V+1,i);if(g){ps[i]=g.pendiente*60;vs[i]=g.valor}}
  let min=d[0][1],imin=0,rec=false,c=0;
  for(let i=1;i<d.length;i++){
    if(d[i][1]<min){min=d[i][1];imin=i;rec=false;c=0}
    if(i<=imin)continue;
    if(!rec){if(d[i][1]-min>=R)rec=true;else continue}
    if(ps[i]!==null&&Math.abs(ps[i])<=U){c++;if(c>=S)return{confirmada:true,voltaje:vs[i]!==null?vs[i]:d[i][1],tiempo:d[i][0]}}else c=0;
  }
  return{confirmada:false,voltaje:null,tiempo:null}
}
function analizar(d){
  if(!d.length)return{};
  let min=Number(d[0][1]),tmin=Number(d[0][0]);for(let i=1;i<d.length;i++){const v=Number(d[i][1]);if(Number.isFinite(v)&&v<min){min=v;tmin=Number(d[i][0])}}
  const e=estabilidad(d),meseta=e.confirmada?Number(e.voltaje):null,te=e.confirmada?Number(e.tiempo):null,rec=e.confirmada&&Number.isFinite(meseta)?meseta-min:null;
  return{minimo:min,tiempoMinimo:tmin,meseta,tiempoEstabilizacion:te,recuperacion:rec,estabilizada:e.confirmada}
}
const fv=v=>v===null||!Number.isFinite(Number(v))?"--":Number(v).toFixed(2)+" V";
function ft(s){if(s===null||!Number.isFinite(Number(s)))return"--";const n=Math.max(0,Math.round(Number(s)));return Math.floor(n/60)+":"+String(n%60).padStart(2,"0")+" min"}
function dibujarEnCanvas(c,d){
  const x=c.getContext("2d"),W=c.width,H=c.height,L=66,R=18,T=20,B=50,aw=W-L-R,ah=H-T-B;
  const TMAX=Math.max(1800,d.length?Math.ceil(d[d.length-1][0]/300)*300:1800);let vmin=117,vmax=132;
  if(d.length){let mi=d[0][1],ma=d[0][1];for(let i=1;i<d.length;i++){mi=Math.min(mi,d[i][1]);ma=Math.max(ma,d[i][1])}if(mi<117)vmin=Math.floor(mi/5)*5;if(ma>132)vmax=Math.ceil(ma/5)*5}
  if(vmax-vmin<10)vmin=vmax-10;x.clearRect(0,0,W,H);x.fillStyle="white";x.fillRect(0,0,W,H);x.font="14px Arial";
  const rango=vmax-vmin;let pv=1;if(rango>20&&rango<=30)pv=2;if(rango>30)pv=5;const primero=Math.ceil(vmin/pv)*pv;
  for(let v=primero;v<=vmax+.001;v+=pv){const y=T+((vmax-v)/(vmax-vmin))*ah;x.strokeStyle="#ddd";x.lineWidth=1;x.beginPath();x.moveTo(L,y);x.lineTo(L+aw,y);x.stroke();x.fillStyle="black";x.textAlign="right";x.fillText(v.toFixed(0)+" V",L-6,y+5)}
  const mm=Math.ceil(TMAX/60),pm=mm<=30?5:(mm<=60?10:15);
  for(let m=0;m<=mm;m+=pm){const s=m*60,xx=L+(s/TMAX)*aw;x.strokeStyle="#ddd";x.beginPath();x.moveTo(xx,T);x.lineTo(xx,T+ah);x.stroke();x.fillStyle="black";x.textAlign="center";x.fillText(m+"m",xx,H-18)}
  x.strokeStyle="black";x.lineWidth=2;x.beginPath();x.moveTo(L,T);x.lineTo(L,T+ah);x.lineTo(L+aw,T+ah);x.stroke();
  if(!d.length)return;const X=s=>L+(s/TMAX)*aw,Y=v=>T+((vmax-v)/(vmax-vmin))*ah;x.lineWidth=1.5;
  for(let i=1;i<d.length;i++){const [t1,v1]=d[i-1],[t2,v2]=d[i];x.strokeStyle=((v1+v2)/2<=110)?"red":"blue";x.beginPath();x.moveTo(X(t1),Y(v1));x.lineTo(X(t2),Y(v2));x.stroke()}
}
function dibujar(d){dibujarEnCanvas(document.getElementById("grafica"),d)}


async function importar(files){
  const csv=[...files].filter(f=>f.name.toLowerCase().endsWith(".csv"));
  if(!csv.length){msg("La carpeta no contiene archivos CSV.");return}
  const e=await todos(), nombres=new Set(e.map(p=>norm(p.nombre))), hashes=new Set();
  for(const p of e){try{hashes.add(p.hash||await hash(p.contenido||""))}catch{}}
  let a=0,d=0,i=0;
  for(const f of csv){
    try{
      const texto=await f.text(),p=csvPuntos(texto);if(!p.length){i++;continue}
      const n=norm(f.name),h=await hash(texto);
      if(nombres.has(n)||hashes.has(h)){d++;continue}
      await guardar({nombre:f.name,contenido:texto,hash:h,importado:Date.now(),muestras:p.length,duracion:p[p.length-1][0]});
      nombres.add(n);hashes.add(h);a++;
    }catch{i++}
  }
  cacheAdyacentes.clear();
  await lista();
  let t=`${a} ${a===1?"prueba agregada":"pruebas agregadas"}`;if(d)t+=` · ${d} duplicada${d===1?"":"s"} omitida${d===1?"":"s"}`;if(i)t+=` · ${i} inválida${i===1?"":"s"}`;msg(t)
}

async function lista(){
  const cont=document.getElementById("lista");
  const todas=await todos();

  todas.sort((a,b)=>b.importado-a.importado);

  // Limpiar selecciones de archivos que ya no existen.
  const idsExistentes=new Set(todas.map(p=>Number(p.id)));
  for(const id of [...seleccionadas]){
    if(!idsExistentes.has(Number(id)))seleccionadas.delete(Number(id));
  }

  const q=textoBusqueda.trim().toLowerCase();

  // Si la búsqueda coincide con el nombre de la subestación, se muestran
  // todas sus pruebas. Si coincide con un archivo concreto, se muestra ese archivo.
  const estacionesQueCoinciden=new Set();
  if(q){
    for(const p of todas){
      const sub=infoArchivo(p.nombre).subestacion.toLowerCase();
      if(sub.includes(q))estacionesQueCoinciden.add(claveSubestacion(p.nombre));
    }
  }

  const ps=todas.filter(p=>{
    if(!q)return true;
    const k=claveSubestacion(p.nombre);
    return estacionesQueCoinciden.has(k) || coincideBusqueda(p,q);
  });

  cont.innerHTML="";

  if(!ps.length){
    cont.innerHTML='<div class="vacio">'+(q?"No se encontraron pruebas.":"No hay pruebas guardadas.")+'</div>';
    cont.classList.toggle("modoSeleccion",modoSeleccion);
    actualizarAccionesSeleccion();
    return;
  }

  // Agrupar por subestación.
  const grupos=new Map();

  for(const p of ps){
    const info=infoArchivo(p.nombre);
    const clave=norm(info.subestacion);

    if(!grupos.has(clave)){
      grupos.set(clave,{
        clave,
        nombre:info.subestacion,
        pruebas:[]
      });
    }

    grupos.get(clave).pruebas.push(p);
  }

  // Orden de los grupos: por la prueba más reciente de cada grupo.
  const ordenGrupos=[...grupos.values()].sort((a,b)=>{
    const aa=Math.max(...a.pruebas.map(p=>Number(p.importado)||0));
    const bb=Math.max(...b.pruebas.map(p=>Number(p.importado)||0));
    return bb-aa;
  });

  // El carrusel seguirá el mismo orden visual: grupo por grupo,
  // y dentro de cada carpeta de la más reciente a la más antigua.
  ordenPruebas=[];

  const crearFilaPrueba=(p)=>{
    const f=document.createElement("div");
    f.className="filaPrueba";

    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.className="selectorPrueba";
    cb.checked=seleccionadas.has(Number(p.id));
    cb.setAttribute("aria-label","Seleccionar "+p.nombre);

    const b=document.createElement("button");
    b.className="archivo"+(cb.checked?" seleccionado":"");
    b.type="button";
    b.innerHTML='<div class="archivoNombre"></div><div class="archivoMeta"></div>';
    b.querySelector(".archivoNombre").textContent=p.nombre;
    b.querySelector(".archivoMeta").textContent=ft(p.duracion);

    const cambiar=()=>{
      const id=Number(p.id);

      if(seleccionadas.has(id)){
        seleccionadas.delete(id);
      }else{
        seleccionadas.add(id);
      }

      cb.checked=seleccionadas.has(id);
      b.classList.toggle("seleccionado",cb.checked);
      actualizarAccionesSeleccion();
    };

    cb.onchange=()=>{
      const id=Number(p.id);

      if(cb.checked){
        seleccionadas.add(id);
      }else{
        seleccionadas.delete(id);
      }

      b.classList.toggle("seleccionado",cb.checked);
      actualizarAccionesSeleccion();
    };

    b.onclick=()=>{
      if(modoSeleccion){
        cambiar();
      }else{
        abrir(p.id);
      }
    };

    f.append(cb,b);
    return f;
  };

  for(const grupo of ordenGrupos){
    grupo.pruebas.sort((a,b)=>b.importado-a.importado);

    for(const p of grupo.pruebas){
      ordenPruebas.push(Number(p.id));
    }

    // Solo crear carpeta cuando existen 2 o más archivos de la misma subestación.
    if(grupo.pruebas.length>=2){
      const caja=document.createElement("div");
      caja.className="grupoCarpeta";

      // Durante una búsqueda la carpeta se abre automáticamente.
      const abierta=q || carpetasAbiertas.has(grupo.clave);
      caja.classList.toggle("abierta",abierta);

      const carpeta=document.createElement("button");
      carpeta.type="button";
      carpeta.className="carpeta";
      carpeta.innerHTML=`
        <span class="carpetaIcono" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path fill="currentColor" d="M3 6.5A2.5 2.5 0 0 1 5.5 4H10l2 2h6.5A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-10Z"/>
          </svg>
        </span>
        <span class="carpetaTexto">
          <span class="carpetaNombre"></span>
          <span class="carpetaMeta"></span>
        </span>
        <span class="carpetaFlecha" aria-hidden="true">›</span>`;

      carpeta.querySelector(".carpetaNombre").textContent=grupo.nombre;
      carpeta.querySelector(".carpetaMeta").textContent=
        grupo.pruebas.length+" "+(grupo.pruebas.length===1?"prueba":"pruebas");

      const contenido=document.createElement("div");
      contenido.className="contenidoCarpeta";

      for(const p of grupo.pruebas){
        contenido.appendChild(crearFilaPrueba(p));
      }

      carpeta.onclick=()=>{
        const ahoraAbierta=!caja.classList.contains("abierta");
        caja.classList.toggle("abierta",ahoraAbierta);

        if(ahoraAbierta){
          carpetasAbiertas.add(grupo.clave);
        }else{
          carpetasAbiertas.delete(grupo.clave);
        }
      };

      caja.append(carpeta,contenido);
      cont.appendChild(caja);
    }else{
      cont.appendChild(crearFilaPrueba(grupo.pruebas[0]));
    }
  }

  cont.classList.toggle("modoSeleccion",modoSeleccion);
  actualizarAccionesSeleccion();
}

function actualizarAccionesSeleccion(){
  const acciones =
    document.getElementById("accionesSeleccion");

  const btn =
    document.getElementById("btnBorrarSeleccion");

  const haySeleccion =
    modoSeleccion &&
    seleccionadas.size > 0;

  acciones.classList.toggle(
    "visible",
    haySeleccion
  );

  btn.disabled =
    !haySeleccion;
}

async function borrarSeleccionadas(){
  if (
    seleccionadas.size === 0
  ) {
    return;
  }

  const n =
    seleccionadas.size;

  if (
    !confirm(
      "¿Eliminar " +
      n +
      " " +
      (
        n === 1
        ?
        "prueba seleccionada"
        :
        "pruebas seleccionadas"
      ) +
      " del visor?"
    )
  ) {
    return;
  }

  for (
    const id of
    [...seleccionadas]
  ) {
    await borrar(
      id
    );
  }

  // Limpiar completamente el modo de selección.
  seleccionadas.clear();
  modoSeleccion = false;

  document.getElementById(
    "btnEditar"
  ).classList.remove(
    "activo"
  );

  document.getElementById(
    "lista"
  ).classList.remove(
    "modoSeleccion"
  );

  document.getElementById(
    "accionesSeleccion"
  ).classList.remove(
    "visible"
  );

  cacheAdyacentes.clear();
  await lista();

  // No dejar mensaje abajo después de borrar.
  const aviso =
    document.getElementById(
      "mensaje"
    );

  aviso.style.display =
    "none";

  aviso.textContent =
    "";
}

async function abrir(id){
  const p=await uno(id);if(!p)return;const d=csvPuntos(p.contenido);if(!d.length){msg("El CSV no contiene datos válidos.");return}
  pruebaActual=p;
  puntosActuales=d;
  indicePruebaActual=ordenPruebas.indexOf(Number(p.id));
  const contenidoActual = document.querySelector("#visor .visorContenido");
  if(contenidoActual && !gestoHorizontal){
    contenidoActual.style.transform = "translateX(0)";
    contenidoActual.style.opacity = "1";
  }
  document.getElementById("nombrePrueba").textContent=p.nombre;
  const v=document.getElementById("visor");v.classList.add("activo");v.setAttribute("aria-hidden","false");document.body.style.overflow="hidden";v.scrollTop=0;dibujar(d);
  const a=analizar(d);document.getElementById("rMin").textContent=fv(a.minimo);document.getElementById("rTMin").textContent=ft(a.tiempoMinimo);
  document.getElementById("rMeseta").textContent=fv(a.meseta);document.getElementById("rTEstable").textContent=ft(a.tiempoEstabilizacion);
  document.getElementById("rRecuperacion").textContent=a.recuperacion===null?"--":(a.recuperacion>=0?"+":"")+Number(a.recuperacion).toFixed(2)+" V";
  document.getElementById("r1").textContent=fv(valorSegundo(d,60));document.getElementById("r10").textContent=fv(valorSegundo(d,600));
  document.getElementById("r20").textContent=fv(valorSegundo(d,1200));document.getElementById("r30").textContent=fv(valorSegundo(d,1800));
  const est=document.getElementById("estabilidad");if(a.estabilizada){est.style.display="block";est.textContent="ESTABILIZADO — "+Number(a.meseta).toFixed(2)+" V"}else{est.style.display="none";est.textContent=""}
  precargarAdyacentes();
}
function cerrar(){quitarPreview();const v=document.getElementById("visor");v.classList.remove("activo");v.setAttribute("aria-hidden","true");document.body.style.overflow="";pruebaActual=null;puntosActuales=[];indicePruebaActual=-1;}

function navegarPrueba(direccion){
  if(!pruebaActual || indicePruebaActual < 0 || ordenPruebas.length === 0)return;

  const nuevoIndice = indicePruebaActual + direccion;

  if(nuevoIndice < 0 || nuevoIndice >= ordenPruebas.length)return;

  abrir(ordenPruebas[nuevoIndice]);
}

let toqueInicioX = null;
let toqueInicioY = null;
let toqueInicioTiempo = 0;
let gestoHorizontal = false;
let desplazamientoActual = 0;
let previewEl = null;
let previewDireccion = 0;
let previewToken = 0;
const cacheAdyacentes = new Map();

function contenidoVisor(){
  return document.querySelector("#visor .visorContenido");
}


function quitarPreview(){
  previewToken++;
  if(previewEl){
    previewEl.remove();
    previewEl=null;
  }
  previewDireccion=0;
}

async function obtenerPruebaPorIndice(indice){
  if(indice < 0 || indice >= ordenPruebas.length)return null;
  const id=ordenPruebas[indice];
  if(cacheAdyacentes.has(id))return cacheAdyacentes.get(id);
  const p=await uno(id);
  if(!p)return null;
  const d=csvPuntos(p.contenido||"");
  if(!d.length)return null;
  const dato={p,d};
  cacheAdyacentes.set(id,dato);
  return dato;
}

async function precargarAdyacentes(){
  if(indicePruebaActual < 0)return;
  const indices=[indicePruebaActual-1,indicePruebaActual+1];
  for(const idx of indices){
    if(idx<0 || idx>=ordenPruebas.length)continue;
    obtenerPruebaPorIndice(idx).catch(()=>{});
  }
}

function llenarPreview(el,p,d){
  const a=analizar(d);
  el.querySelector(".previewNombre").textContent=p.nombre;

  const valores=[
    ["r1",fv(valorSegundo(d,60))],
    ["r10",fv(valorSegundo(d,600))],
    ["r20",fv(valorSegundo(d,1200))],
    ["r30",fv(valorSegundo(d,1800))],
    ["rMin",fv(a.minimo)],
    ["rTMin",ft(a.tiempoMinimo)],
    ["rMeseta",fv(a.meseta)],
    ["rTEstable",ft(a.tiempoEstabilizacion)],
    ["rRecuperacion",a.recuperacion===null?"--":(a.recuperacion>=0?"+":"")+Number(a.recuperacion).toFixed(2)+" V"]
  ];

  for(const [k,v] of valores){
    const n=el.querySelector('[data-r="'+k+'"]');
    if(n)n.textContent=v;
  }

  const est=el.querySelector(".previewEstabilidad");
  if(a.estabilizada){
    est.style.display="block";
    est.textContent="ESTABILIZADO — "+Number(a.meseta).toFixed(2)+" V";
  }else{
    est.style.display="none";
    est.textContent="";
  }

  dibujarEnCanvas(el.querySelector("canvas"),d);
}

function crearElementoPreview(p,d){
  const actual=contenidoVisor();
  const visor=document.getElementById("visor");
  const el=document.createElement("div");
  el.className="visorPreview";

  el.innerHTML=`
    <div class="previewNombre" style="text-align:center;font-size:18px;font-weight:750;word-break:break-word;margin:0 50px 16px"></div>
    <div class="panelVisor">
      <canvas width="1200" height="650"></canvas>
      <div class="estabilidad previewEstabilidad"></div>
    </div>
    <div class="panelVisor">
      <div class="resultado"><span>1 min</span><span data-r="r1" class="valor">--</span></div>
      <div class="resultado"><span>10 min</span><span data-r="r10" class="valor">--</span></div>
      <div class="resultado"><span>20 min</span><span data-r="r20" class="valor">--</span></div>
      <div class="resultado"><span>30 min</span><span data-r="r30" class="valor">--</span></div>
      <div class="separador"></div>
      <div class="resultado"><span>Mínimo</span><span data-r="rMin" class="valor">--</span></div>
      <div class="resultado"><span>Tiempo del mínimo</span><span data-r="rTMin" class="valor">--</span></div>
      <div class="resultado"><span>Meseta</span><span data-r="rMeseta" class="valor">--</span></div>
      <div class="resultado"><span>Tiempo de estabilización</span><span data-r="rTEstable" class="valor">--</span></div>
      <div class="resultado"><span>Recuperación</span><span data-r="rRecuperacion" class="valor">--</span></div>
    </div>`;

  el.style.top=actual.offsetTop+"px";
  el.style.left=actual.offsetLeft+"px";
  el.style.width=actual.offsetWidth+"px";

  visor.appendChild(el);
  llenarPreview(el,p,d);
  return el;
}

function anchoCarrusel(){
  return Math.max(document.getElementById("visor").clientWidth,window.innerWidth,320);
}

function posicionarPaginas(dx){
  const actual=contenidoVisor();
  if(actual){
    actual.style.transform="translateX("+dx+"px)";
    actual.style.opacity="1";
  }

  if(previewEl){
    const w=anchoCarrusel();
    const base=previewDireccion>0?w:-w;
    previewEl.style.transform="translateX("+(base+dx)+"px)";
    previewEl.style.opacity="1";
  }
}

async function asegurarPreview(direccion){
  if(direccion!==1 && direccion!==-1)return null;

  const nuevoIndice=indicePruebaActual+direccion;
  if(nuevoIndice<0 || nuevoIndice>=ordenPruebas.length){
    quitarPreview();
    return null;
  }

  if(previewEl && previewDireccion===direccion){
    return previewEl;
  }

  const token=++previewToken;

  if(previewEl){
    previewEl.remove();
    previewEl=null;
  }

  previewDireccion=direccion;

  const dato=await obtenerPruebaPorIndice(nuevoIndice);
  if(token!==previewToken || !dato)return null;

  previewEl=crearElementoPreview(dato.p,dato.d);

  const w=anchoCarrusel();
  previewEl.style.transition="none";
  previewEl.style.transform="translateX("+(direccion>0?w:-w)+"px)";

  posicionarPaginas(desplazamientoActual);
  return previewEl;
}

async function finalizarCambioCarrusel(direccion){
  const actual=contenidoVisor();
  const p=await asegurarPreview(direccion);

  if(!actual || !p){
    if(actual){
      actual.style.transition="transform .20s ease";
      actual.style.transform="translateX(0)";
    }
    quitarPreview();
    return;
  }

  const w=anchoCarrusel();
  const salida=direccion>0?-w:w;

  actual.style.transition="transform .22s ease";
  p.style.transition="transform .22s ease";

  requestAnimationFrame(()=>{
    actual.style.transform="translateX("+salida+"px)";
    p.style.transform="translateX(0)";
  });

  await new Promise(resolve=>setTimeout(resolve,230));

  const nuevoIndice=indicePruebaActual+direccion;
  const nuevoId=ordenPruebas[nuevoIndice];

  // La vista previa permanece encima mientras se carga el contenido real.
  await abrir(nuevoId);

  const nuevoActual=contenidoVisor();
  nuevoActual.style.transition="none";
  nuevoActual.style.transform="translateX(0)";
  nuevoActual.style.opacity="1";

  if(previewEl){
    previewEl.remove();
    previewEl=null;
  }
  previewDireccion=0;

  requestAnimationFrame(()=>{
    nuevoActual.style.transition="transform .22s ease";
  });

  precargarAdyacentes();
}

function regresarCarrusel(){
  const actual=contenidoVisor();
  const p=previewEl;
  const w=anchoCarrusel();

  if(actual){
    actual.style.transition="transform .20s ease";
    actual.style.transform="translateX(0)";
  }

  if(p){
    p.style.transition="transform .20s ease";
    p.style.transform="translateX("+(previewDireccion>0?w:-w)+"px)";
    setTimeout(()=>{
      if(previewEl===p){
        p.remove();
        previewEl=null;
        previewDireccion=0;
      }
    },210);
  }
}

function iniciarGestoVisor(event){
  if(!event.touches || event.touches.length !== 1)return;

  const t = event.touches[0];
  toqueInicioX = t.clientX;
  toqueInicioY = t.clientY;
  toqueInicioTiempo = Date.now();
  gestoHorizontal = false;
  desplazamientoActual = 0;

  quitarPreview();
  precargarAdyacentes();

  const c = contenidoVisor();
  if(c){
    c.style.transition = "none";
    c.style.transform = "translateX(0)";
    c.style.opacity = "1";
  }
}

function moverGestoVisor(event){
  if(toqueInicioX === null || toqueInicioY === null)return;
  if(!event.touches || event.touches.length !== 1)return;

  const t = event.touches[0];
  const dx = t.clientX - toqueInicioX;
  const dy = t.clientY - toqueInicioY;

  if(!gestoHorizontal){
    if(Math.abs(dx) < 10 && Math.abs(dy) < 10)return;

    if(Math.abs(dy) >= Math.abs(dx)){
      toqueInicioX = null;
      toqueInicioY = null;
      return;
    }

    gestoHorizontal = true;
  }

  if(!gestoHorizontal)return;
  if(event.cancelable)event.preventDefault();

  const direccion = dx < 0 ? 1 : -1;
  const nuevoIndice = indicePruebaActual + direccion;
  const hayAdyacente = nuevoIndice >= 0 && nuevoIndice < ordenPruebas.length;

  let desplazamiento = dx;

  if(!hayAdyacente){
    desplazamiento = dx * 0.28;
    quitarPreview();
  }else{
    asegurarPreview(direccion);
  }

  desplazamientoActual = desplazamiento;
  posicionarPaginas(desplazamiento);
}

async function animarCambioPrueba(direccion){
  await finalizarCambioCarrusel(direccion);
}

function terminarGestoVisor(event){
  if(toqueInicioX === null || toqueInicioY === null){
    return;
  }

  const dx = desplazamientoActual;
  const dt = Date.now() - toqueInicioTiempo;

  toqueInicioX = null;
  toqueInicioY = null;
  toqueInicioTiempo = 0;

  const eraHorizontal = gestoHorizontal;
  gestoHorizontal = false;
  desplazamientoActual = 0;

  const c = contenidoVisor();
  if(!c)return;

  if(!eraHorizontal){
    regresarCarrusel();
    return;
  }

  const umbral = Math.min(95, window.innerWidth * 0.22);

  if(Math.abs(dx) >= umbral && dt <= 1400){
    if(dx < 0){
      animarCambioPrueba(1);
    }else{
      animarCambioPrueba(-1);
    }
  }else{
    regresarCarrusel();
  }
}


function actualizarBotonLimpiarBusqueda(){
  document.getElementById("btnLimpiarBusqueda").classList.toggle(
    "visible",
    textoBusqueda.length>0
  );
}

function alternarBusqueda(){
  busquedaVisible=!busquedaVisible;

  const barra=document.getElementById("barraBusqueda");
  const btn=document.getElementById("btnBuscar");
  const campo=document.getElementById("buscarPrueba");

  barra.classList.toggle("visible",busquedaVisible);
  btn.classList.toggle("activo",busquedaVisible);

  if(busquedaVisible){
    setTimeout(()=>campo.focus(),50);
  }else{
    textoBusqueda="";
    campo.value="";
    actualizarBotonLimpiarBusqueda();
    lista();
  }
}

function limpiarBusqueda(){
  textoBusqueda="";
  const campo=document.getElementById("buscarPrueba");
  campo.value="";
  actualizarBotonLimpiarBusqueda();
  lista();
  campo.focus();
}

function edit(){
  modoSeleccion=!modoSeleccion;
  if(!modoSeleccion)seleccionadas.clear();
  document.getElementById("lista").classList.toggle("modoSeleccion",modoSeleccion);
  document.getElementById("btnEditar").classList.toggle("activo",modoSeleccion);
  lista();
}

document.getElementById("btnBuscar").onclick=alternarBusqueda;
document.getElementById("buscarPrueba").oninput=e=>{
  textoBusqueda=String(e.target.value||"");
  actualizarBotonLimpiarBusqueda();
  lista();
};
document.getElementById("btnLimpiarBusqueda").onclick=limpiarBusqueda;
document.getElementById("btnAgregar").onclick=()=>document.getElementById("selectorCarpeta").click();
document.getElementById("selectorCarpeta").onchange=async e=>{const f=[...e.target.files];e.target.value="";if(f.length)await importar(f)};
document.getElementById("btnEditar").onclick=edit;
document.getElementById("btnBorrarSeleccion").onclick=borrarSeleccionadas;
document.getElementById("btnCerrarVisor").onclick=cerrar;

const visorGestos = document.getElementById("visor");
visorGestos.addEventListener("touchstart", iniciarGestoVisor, {passive:true});
visorGestos.addEventListener("touchmove", moverGestoVisor, {passive:false});
visorGestos.addEventListener("touchend", terminarGestoVisor, {passive:true});
visorGestos.addEventListener("touchcancel", terminarGestoVisor, {passive:true});

document.addEventListener("keydown", event => {
  if(!document.getElementById("visor").classList.contains("activo"))return;
  if(event.key === "ArrowLeft") navegarPrueba(-1);
  if(event.key === "ArrowRight") navegarPrueba(1);
});
window.addEventListener("resize",()=>{if(puntosActuales.length)dibujar(puntosActuales)});

(async()=>{try{await abrirDB();await lista()}catch{msg("No se pudo abrir el almacenamiento local.")}if("serviceWorker"in navigator){try{await navigator.serviceWorker.register("./sw.js?v=10", { updateViaCache: "none" })}catch{}}})();
